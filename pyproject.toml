[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "groundedtrail"
version = "0.1.0"
description = "Traceable document retrieval and reproducible RAG evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "langchain-core>=1.0,<2",
  "langchain-postgres>=0.0.17,<1",
  "pgvector>=0.3,<1",
]

[project.optional-dependencies]
local = ["langchain-huggingface>=1.0,<2", "sentence-transformers>=3,<6"]
openai = ["langchain-openai>=1.0,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
